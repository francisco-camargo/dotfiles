# Gates that run before a commit is created. Install them with `pre-commit
# install`, which install.sh does for you.
#
# These catch what GitHub's own scanning misses or catches too late: push
# protection only knows recognized credential formats, and an Actions scan on a
# public repo reports after the commit is already published.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        args: ["--no-progress", "--offline", "--include-fragments", "."]
        files: \.md$
        pass_filenames: false
